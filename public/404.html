<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rebels Boxing Gym</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAFAF6;--ink:#161616;--muted:#67675F;--yel:#FFC400}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;padding:32px 24px
  }
  main{max-width:560px}
  .chip{
    display:inline-block;background:var(--yel);color:var(--ink);
    font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 12px;margin:0 0 20px
  }
  h1{
    margin:0 0 16px;font-family:'Anton','Arial Narrow',sans-serif;font-weight:400;
    font-size:clamp(48px,10vw,96px);line-height:.96;letter-spacing:.02em;text-transform:uppercase
  }
  h1 span{color:var(--yel)}
  p{margin:0 0 28px;font-size:17px;line-height:1.6;color:var(--muted)}
  a.btn{
    display:inline-block;text-decoration:none;background:var(--yel);color:var(--ink);
    font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    padding:16px 24px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)
  }
  a.btn:hover{background:#FFD23F}
</style>
</head>
<body>
<main>
  <span class="chip">404 — swing and a miss</span>
  <h1>That page ducked<span>.</span></h1>
  <p>Whatever you were looking for isn't here. The gym is exactly where it's always been — Tuesday, Thursday and Sunday evenings in Vauxhall.</p>
  <a class="btn" href="/">Back to the gym</a>
</main>
</body>
</html>
